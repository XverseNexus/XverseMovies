<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XverseMovies — Browse</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="xverse-config.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E50914;--bg:#141414;--card:#1c1c1c;--text:#e5e5e5;--muted:#808080;--border:rgba(255,255,255,.09);--green:#46d369}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;overflow-x:hidden}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:66px;display:flex;align-items:center;padding:0 4%;gap:0;background:rgba(8,8,8,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',cursive;font-size:2rem;color:var(--red);letter-spacing:2px;margin-right:28px;cursor:pointer;text-decoration:none;flex-shrink:0}
.logo span{color:#fff}
.nav-links{display:flex;gap:2px;list-style:none}
.nl{color:rgba(255,255,255,.68);font-size:.86rem;font-weight:500;padding:6px 12px;border-radius:4px;transition:all .2s;cursor:pointer;white-space:nowrap;border:none;background:none;font-family:'Barlow',sans-serif}
.nl:hover{color:#fff;background:rgba(255,255,255,.07)}
.nl.active{color:#fff;font-weight:700}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-av{width:30px;height:30px;border-radius:4px;background:linear-gradient(135deg,var(--red),#831010);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;cursor:pointer;color:#fff;overflow:hidden;border:2px solid transparent;transition:border-color .2s;flex-shrink:0}
.nav-av:hover{border-color:rgba(255,255,255,.5)}
.nav-av img{width:100%;height:100%;object-fit:cover}
#pageWrap{padding-top:66px}
/* PAGE TABS */
.pg-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 4%;background:var(--bg);position:sticky;top:66px;z-index:100;overflow-x:auto;scrollbar-width:none}
.pg-tabs::-webkit-scrollbar{display:none}
.ptab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:.88rem;font-weight:600;padding:14px 18px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;margin-bottom:-1px;white-space:nowrap}
.ptab:hover{color:var(--text)}
.ptab.active{color:#fff;border-bottom-color:var(--red)}
/* HERO */
.pg-hero{position:relative;height:390px;overflow:hidden}
.h-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.h-grad{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.88) 0%,rgba(0,0,0,.3) 55%,transparent 100%),linear-gradient(to top,rgba(20,20,20,1) 0%,transparent 45%)}
.h-c{position:relative;z-index:2;padding:0 4%;display:flex;flex-direction:column;justify-content:flex-end;height:100%;padding-bottom:28px}
.h-badge{display:inline-flex;align-items:center;background:rgba(229,9,20,.88);color:#fff;font-size:.6rem;font-weight:800;padding:3px 10px;border-radius:3px;letter-spacing:1.5px;margin-bottom:11px;width:fit-content}
.h-title{font-family:'Bebas Neue',cursive;font-size:clamp(2rem,4.5vw,3.5rem);color:#fff;letter-spacing:2px;line-height:1;margin-bottom:9px}
.h-meta{display:flex;align-items:center;gap:11px;margin-bottom:9px;flex-wrap:wrap;font-size:.8rem}
.h-match{color:var(--green);font-weight:700}
.h-cert{border:1px solid rgba(255,255,255,.42);padding:1px 5px;border-radius:2px;color:rgba(255,255,255,.78)}
.h-ov{font-size:.84rem;color:rgba(255,255,255,.72);line-height:1.5;max-width:460px;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h-btns{display:flex;gap:9px;flex-wrap:wrap}
.btn-p{background:#fff;color:#000;border:none;padding:9px 22px;font-size:.88rem;font-weight:800;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;display:flex;align-items:center;gap:6px;transition:background .2s}
.btn-p:hover{background:#d4d4d4}
.btn-i{background:rgba(109,109,110,.65);color:#fff;border:none;padding:9px 18px;font-size:.88rem;font-weight:700;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;backdrop-filter:blur(4px);transition:background .2s}
.btn-i:hover{background:rgba(109,109,110,.88)}
/* GENRE PILLS */
.gpstrip{display:flex;gap:7px;padding:14px 4%;overflow-x:auto;scrollbar-width:none}
.gpstrip::-webkit-scrollbar{display:none}
.gp{background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.7);padding:6px 15px;border-radius:20px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;white-space:nowrap;flex-shrink:0}
.gp:hover{background:rgba(255,255,255,.13);color:#fff}
.gp.on{background:#fff;color:#000;border-color:#fff}
/* FILTER ROW */
.frow{display:flex;align-items:center;gap:8px;padding:0 4% 14px;flex-wrap:wrap}
.flbl{font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.fsel{background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.76);padding:6px 12px;border-radius:6px;font-size:.76rem;font-family:'Barlow',sans-serif;cursor:pointer;outline:none}
.fsel option{background:#1c1c1c}
.fsp{flex:1}
.rcnt{font-size:.74rem;color:var(--muted)}
.vtog{display:flex;gap:3px}
.vb{background:none;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:4px;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.vb.on,.vb:hover{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.2)}
/* CONTENT */
.cont{padding:0 4% 60px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.st{font-size:1.04rem;font-weight:700;color:#fff}
.sb{background:rgba(229,9,20,.14);color:var(--red);font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:3px;margin-left:6px;letter-spacing:.5px}
/* CARD GRID */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-bottom:30px}
.cgrid.lm{grid-template-columns:1fr;gap:5px}
.card{border-radius:5px;overflow:hidden;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s;position:relative}
.card:hover{transform:scale(1.06);border-color:rgba(255,255,255,.25);box-shadow:0 7px 28px rgba(0,0,0,.65);z-index:3}
.card.lc{display:flex;align-items:center;transform:none!important;transition:background .2s,border-color .2s;border-radius:6px}
.card.lc:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16);box-shadow:none}
.cth{position:relative;aspect-ratio:2/3;overflow:hidden}
.card.lc .cth{width:62px;height:93px;flex-shrink:0;aspect-ratio:unset}
.ci{width:100%;height:100%;object-fit:cover;background:#222;display:block;transition:filter .22s}
.card:hover .ci{filter:brightness(.55)}
.card.lc:hover .ci{filter:brightness(.8)}
.cov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.36)}
.card:hover .cov,.card.lc:hover .cov{opacity:1}
.card.lc .cov{flex-direction:row}
.cpl{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);border:none;color:#000;font-size:.88rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;flex-shrink:0}
.cpl:hover{transform:scale(1.1)}
.cad{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cad:hover{background:rgba(229,9,20,.36);border-color:var(--red)}
.ctyp{position:absolute;top:5px;left:5px;font-size:.54rem;font-weight:800;padding:2px 5px;border-radius:3px;letter-spacing:.8px}
.ctyp.movie{background:rgba(229,9,20,.8);color:#fff}
.ctyp.tv{background:rgba(33,150,243,.8);color:#fff}
.crat{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.7);color:var(--green);font-size:.58rem;font-weight:700;padding:2px 5px;border-radius:3px;opacity:0;transition:opacity .2s}
.card:hover .crat{opacity:1}
.cif{padding:7px 8px 9px}
.card.lc .cif{flex:1;padding:9px 13px;min-width:0}
.cn{font-size:.78rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.card.lc .cn{font-size:.88rem;white-space:normal;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.cm{font-size:.64rem;color:var(--muted);display:flex;gap:4px;align-items:center}
.card.lc .cm{font-size:.72rem}
.lacts{display:flex;gap:5px;align-items:center;padding:0 11px;flex-shrink:0}
.lb{background:rgba(255,255,255,.07);border:1px solid var(--border);color:rgba(255,255,255,.66);width:27px;height:27px;border-radius:50%;cursor:pointer;font-size:.74rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.lb:hover{background:rgba(255,255,255,.13);color:#fff}
/* TOP 10 */
.t10w{display:flex;gap:0;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;margin-bottom:30px}
.t10w::-webkit-scrollbar{display:none}
.t10c{flex-shrink:0;display:flex;align-items:flex-end;cursor:pointer;transition:transform .2s}
.t10c:hover{transform:scale(1.04);z-index:3}
.t10n{font-family:'Bebas Neue',cursive;font-size:6.5rem;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.15);line-height:1;margin-right:-17px;z-index:1;flex-shrink:0;transition:-webkit-text-stroke-color .2s}
.t10c:hover .t10n{-webkit-text-stroke-color:rgba(255,255,255,.38)}
.t10p{width:94px;height:138px;border-radius:4px;object-fit:cover;background:#222;z-index:2;position:relative;border:1px solid var(--border)}
/* NP */
.npl{display:flex;flex-direction:column;gap:1px;margin-bottom:30px}
.npc{display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--border);cursor:pointer;transition:background .18s}
.npc:first-child{border-radius:7px 7px 0 0}
.npc:last-child{border-radius:0 0 7px 7px;border-bottom:none}
.npc:hover{background:#222}
.nprk{width:48px;font-family:'Bebas Neue',cursive;font-size:1.5rem;color:rgba(255,255,255,.15);text-align:center;flex-shrink:0}
.npth{width:88px;height:50px;object-fit:cover;flex-shrink:0;background:#222}
.npif{flex:1;padding:10px 13px;min-width:0}
.nptl{font-size:.86rem;font-weight:700;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npmt{font-size:.68rem;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.npnew{background:rgba(70,211,105,.14);color:var(--green);font-size:.56rem;font-weight:700;padding:1px 5px;border-radius:3px;letter-spacing:.5px}
.nphot{background:rgba(229,9,20,.12);color:var(--red);font-size:.56rem;font-weight:700;padding:1px 5px;border-radius:3px}
.npact{display:flex;gap:6px;align-items:center;padding-right:13px;opacity:0;transition:opacity .2s}
.npc:hover .npact{opacity:1}
.npb{background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.76rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.npb:hover{background:rgba(255,255,255,.15)}
/* LANG GRID */
.lgg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px;margin-bottom:40px}
/* LOAD MORE */
.lm-btn{display:block;width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:rgba(255,255,255,.68);padding:12px;font-size:.84rem;font-weight:600;border-radius:6px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;text-align:center;margin-bottom:22px}
.lm-btn:hover{background:rgba(255,255,255,.11);color:#fff}
/* SKELETON */
.sk{background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%);background-size:200% 100%;animation:ska 1.4s infinite;border-radius:4px}
@keyframes ska{0%{background-position:200%}100%{background-position:-200%}}
/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.mbg.open{display:flex;animation:mfi .22s ease}
@keyframes mfi{from{opacity:0}to{opacity:1}}
.mo{background:#181818;border:1px solid rgba(255,255,255,.1);border-radius:10px;width:min(96vw,560px);max-height:90vh;overflow-y:auto;animation:msu .28s ease}
@keyframes msu{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.mh{position:relative;height:210px;overflow:hidden}
.mh img{width:100%;height:100%;object-fit:cover;display:block}
.mhg{position:absolute;inset:0;background:linear-gradient(to top,#181818 0%,transparent 55%)}
.mx{position:absolute;top:11px;right:11px;background:rgba(0,0,0,.6);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.86rem;display:flex;align-items:center;justify-content:center}
.mx:hover{background:rgba(0,0,0,.88)}
.mb{padding:14px 20px 26px}
.mt{font-family:'Bebas Neue',cursive;font-size:1.6rem;color:#fff;letter-spacing:1px;margin-bottom:7px}
.mm{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px;font-size:.76rem}
.mmt{color:var(--green);font-weight:700}
.mce{border:1px solid rgba(255,255,255,.38);padding:1px 5px;border-radius:2px;color:rgba(255,255,255,.7)}
.mov{font-size:.83rem;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:14px}
.mac{display:flex;gap:9px;flex-wrap:wrap}
.mpl{background:#fff;color:#000;border:none;padding:9px 22px;font-size:.86rem;font-weight:800;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;display:flex;align-items:center;gap:6px;transition:background .2s}
.mpl:hover{background:#d4d4d4}
.mad{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.22);padding:9px 18px;font-size:.86rem;font-weight:700;border-radius:4px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s}
.mad:hover{background:rgba(255,255,255,.17)}
/* PAGE SECTIONS */
.bpg{display:none}
.bpg.active{display:block}
@media(max-width:640px){.nav-links{display:none}.cgrid{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:7px}.t10n{font-size:5rem}.t10p{width:76px;height:112px}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="XverseMovies_Home.html">Xverse<span>Movies</span></a>
  <ul class="nav-links">
    <li><button class="nl" onclick="location.href='XverseMovies_Home.html'">Home</button></li>
    <li><button class="nl active" id="nlTV" onclick="switchPage('tv')">TV Shows</button></li>
    <li><button class="nl" id="nlMov" onclick="switchPage('movies')">Movies</button></li>
    <li><button class="nl" id="nlNew" onclick="switchPage('new')">New & Popular</button></li>
    <li><button class="nl" id="nlLang" onclick="switchPage('languages')">Browse Languages</button></li>

  </ul>
  <div class="nav-right"><div class="nav-av" id="navAvatar">U</div></div>
</nav>

<div id="pageWrap">

  <!-- TV SHOWS -->
  <div class="bpg active" id="pg-tv">
    <div class="pg-hero"><div class="h-bg" id="tvBg"></div><div class="h-grad"></div><div class="h-c" id="tvHeroC"><div class="sk" style="width:90px;height:20px;margin-bottom:11px;border-radius:3px"></div><div class="sk" style="width:280px;height:42px;margin-bottom:9px;border-radius:3px"></div><div class="sk" style="width:360px;height:40px;margin-bottom:15px;border-radius:3px"></div><div style="display:flex;gap:9px"><div class="sk" style="width:105px;height:36px;border-radius:4px"></div><div class="sk" style="width:120px;height:36px;border-radius:4px"></div></div></div></div>
    <div class="pg-tabs"><button class="ptab active" onclick="tvTab('',this)">All</button><button class="ptab" onclick="tvTab('hi',this)">Hindi</button><button class="ptab" onclick="tvTab('en',this)">English</button><button class="ptab" onclick="tvTab('ko',this)">Korean</button><button class="ptab" onclick="tvTab('ja',this)">Anime</button></div>
    <div class="gpstrip" id="tvGP"></div>
    <div class="frow"><span class="flbl">Sort:</span><select class="fsel" onchange="sortTV(this.value)"><option value="">Popular</option><option value="rating">Highest Rated</option><option value="year">Newest</option><option value="alpha">A–Z</option></select><div class="fsp"></div><span class="rcnt" id="tvCnt"></span><div class="vtog"><button class="vb on" onclick="setV('tv','grid',this)">⊞</button><button class="vb" onclick="setV('tv','list',this)">☰</button></div></div>
    <div class="cont"><div class="sh"><span class="st">Top 10 TV Shows <span class="sb">INDIA</span></span></div><div class="t10w" id="tvT10"></div><div class="sh"><span class="st" id="tvGridLbl">All TV Shows</span></div><div class="cgrid" id="tvGrid"></div><button class="lm-btn" id="tvLM" onclick="loadMore('tv')" style="display:none">Load More ↓</button></div>
  </div>

  <!-- MOVIES -->
  <div class="bpg" id="pg-movies">
    <div class="pg-hero"><div class="h-bg" id="movBg"></div><div class="h-grad"></div><div class="h-c" id="movHeroC"><div class="sk" style="width:90px;height:20px;margin-bottom:11px;border-radius:3px"></div><div class="sk" style="width:280px;height:42px;margin-bottom:9px;border-radius:3px"></div><div class="sk" style="width:360px;height:40px;margin-bottom:15px;border-radius:3px"></div><div style="display:flex;gap:9px"><div class="sk" style="width:105px;height:36px;border-radius:4px"></div><div class="sk" style="width:120px;height:36px;border-radius:4px"></div></div></div></div>
    <div class="gpstrip" id="movGP"></div>
    <div class="frow"><span class="flbl">Sort:</span><select class="fsel" onchange="sortMov(this.value)"><option value="">Popular</option><option value="rating">Highest Rated</option><option value="year">Newest</option><option value="alpha">A–Z</option></select><select class="fsel" onchange="filterMovL(this.value)"><option value="">All Languages</option><option value="hi">Hindi</option><option value="en">English</option><option value="te">Telugu</option><option value="ta">Tamil</option></select><div class="fsp"></div><span class="rcnt" id="movCnt"></span><div class="vtog"><button class="vb on" onclick="setV('mov','grid',this)">⊞</button><button class="vb" onclick="setV('mov','list',this)">☰</button></div></div>
    <div class="cont"><div class="sh"><span class="st">Top 10 Movies <span class="sb">THIS WEEK</span></span></div><div class="t10w" id="movT10"></div><div class="sh"><span class="st">All Movies</span></div><div class="cgrid" id="movGrid"></div><button class="lm-btn" id="movLM" onclick="loadMore('mov')" style="display:none">Load More ↓</button></div>
  </div>

  <!-- NEW & POPULAR -->
  <div class="bpg" id="pg-new">
    <div style="padding:82px 4% 0"><div style="font-family:'Bebas Neue',cursive;font-size:2rem;color:#fff;letter-spacing:2px;margin-bottom:3px">New & Popular</div><div style="font-size:.82rem;color:var(--muted);margin-bottom:16px">Coming soon aur sabka favourite</div></div>
    <div class="pg-tabs" style="position:static;margin:0"><button class="ptab active" onclick="npSwitch('watching',this)">Everyone's Watching</button><button class="ptab" onclick="npSwitch('top10',this)">Top 10</button><button class="ptab" onclick="npSwitch('new',this)">New Arrivals</button></div>
    <div class="cont" style="padding-top:20px" id="npCont"></div>
  </div>

  <!-- LANGUAGES -->
  <div class="bpg" id="pg-languages">
    <div style="padding:82px 4% 0"><div style="font-family:'Bebas Neue',cursive;font-size:2rem;color:#fff;letter-spacing:2px;margin-bottom:3px">Browse by Language</div><div style="font-size:.82rem;color:var(--muted);margin-bottom:22px">Apni bhasha mein content dhundho</div></div>
    <div class="cont"><div class="lgg" id="langG"></div></div>
  </div>
</div>

<!-- MODAL -->
<div class="mbg" id="modBg" onclick="if(event.target===this)closeMod()">
  <div class="mo">
    <div class="mh"><img id="modImg" src="" alt=""><div class="mhg"></div><button class="mx" onclick="closeMod()">✕</button></div>
    <div class="mb"><div class="mt" id="modTit"></div><div class="mm" id="modMeta"></div><div class="mov" id="modOv"></div>
      <div class="mac"><button class="mpl" id="mPlayBtn">▶ Play</button><button class="mad" id="mAddBtn">＋ My List</button><button class="mad" onclick="closeMod()">✕ Close</button></div>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let tvData=[], movData=[], npItems=[];
let tvV='grid', movV='grid';
let tvPage=0, movPage=0;
let tvF={lang:'',genre:'',sort:''}, movF={lang:'',genre:'',sort:''};
const PS=20;
const TVGENRES=['All','Drama','Action','Comedy','Thriller','Sci-Fi','Horror','Fantasy','Anime','Crime','Hindi','Korean'];
const MOVGENRES=['All','Action','Drama','Comedy','Horror','Sci-Fi','Romance','Thriller','Animation','Crime','Hindi','Telugu','Tamil'];
const LANGS=[{code:'hi',name:'Hindi',icon:'🇮🇳',count:1800,bg:'#5c1a1a'},{code:'en',name:'English',icon:'🇬🇧',count:4200,bg:'#1a3a5c'},{code:'te',name:'Telugu',icon:'🎭',count:650,bg:'#3a3a1a'},{code:'ta',name:'Tamil',icon:'🌺',count:580,bg:'#1a3a2a'},{code:'kn',name:'Kannada',icon:'🦁',count:320,bg:'#2a1a3a'},{code:'ml',name:'Malayalam',icon:'🌴',count:410,bg:'#1a2a3a'},{code:'ko',name:'Korean',icon:'🇰🇷',count:730,bg:'#1a1a5c'},{code:'ja',name:'Japanese',icon:'🇯🇵',count:890,bg:'#3a1a1a'}];

(async()=>{
  currentUser = await requireAuth(); if(!currentUser) return;
  await initNavAvatar('navAvatar');
  const hash = location.hash.replace('#','') || 'tv';
  switchPage(hash);
})();

function switchPage(pg){
  document.querySelectorAll('.bpg').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('[id^="nl"]').forEach(b=>b.classList.remove('active'));
  const p=document.getElementById('pg-'+pg), l=document.getElementById('nl'+pg[0].toUpperCase()+pg.slice(1));
  if(p) p.classList.add('active'); if(l) l.classList.add('active');
  location.hash=pg;
  if(pg==='tv' && !tvData.length) loadTV();
  if(pg==='movies' && !movData.length) loadMovies();
  if(pg==='new' && !npItems.length) loadNP('watching');
  if(pg==='languages' && !document.getElementById('langG').children.length) buildLangs();
}

// ── TV ────────────────────────────────────
async function loadTV(){
  document.getElementById('tvGrid').innerHTML = skelG(20);
  const [dbTV,tmdbPop,tmdbTop] = await Promise.all([
    DB.getMovies({type:'tv',limit:50}).then(r=>r.data||[]),
    TMDB.popularTV(), TMDB.topTV()
  ]);
  const norm = arr => (arr?.results||[]).filter(m=>m.poster_path).map(TMDB.normalize);
  const tnorm = norm(tmdbPop), ttop = norm(tmdbTop);
  tvData = [...dbTV, ...tnorm.filter(t=>!dbTV.find(d=>d.tmdb_id===t.tmdb_id))];
  const hero = tvData.find(m=>m.backdrop_url)||tnorm[0];
  if(hero) setHero('tv',hero);
  buildT10('tvT10', ttop.slice(0,10));
  buildPills('tvGP', TVGENRES, g=>{ tvF.genre=g==='All'?'':g; tvPage=0; renderTV(); });
  renderTV();
}
function renderTV(){
  let d=[...tvData];
  if(tvF.lang) d=d.filter(m=>(m.language||m.lang)===tvF.lang);
  if(tvF.genre) d=d.filter(m=>(m.genres||m.genre||[]).includes(tvF.genre));
  if(tvF.sort==='rating') d.sort((a,b)=>(b.rating||b.vote_average||0)-(a.rating||a.vote_average||0));
  if(tvF.sort==='alpha') d.sort((a,b)=>a.title.localeCompare(b.title));
  if(tvF.sort==='year') d.sort((a,b)=>(b.year||'')>(a.year||'')?1:-1);
  const pg=d.slice(0,PS*(tvPage+1));
  document.getElementById('tvCnt').textContent=d.length+' titles';
  document.getElementById('tvGrid').className='cgrid'+(tvV==='list'?' lm':'');
  document.getElementById('tvGrid').innerHTML=pg.map(m=>cHTML(m,tvV==='list')).join('');
  document.getElementById('tvLM').style.display=d.length>pg.length?'block':'none';
}
function tvTab(lang,btn){ document.querySelectorAll('#pg-tv .ptab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); tvF.lang=lang; tvPage=0; renderTV(); }
function sortTV(s){ tvF.sort=s; tvPage=0; renderTV(); }

// ── MOVIES ────────────────────────────────
async function loadMovies(){
  document.getElementById('movGrid').innerHTML=skelG(20);
  const [dbMov,tmdbPop,tmdbTop]=await Promise.all([
    DB.getMovies({type:'movie',limit:50}).then(r=>r.data||[]),
    TMDB.popularMov(), TMDB.topMovies()
  ]);
  const norm=arr=>(arr?.results||[]).filter(m=>m.poster_path).map(TMDB.normalize);
  const tnorm=norm(tmdbPop), ttop=norm(tmdbTop);
  movData=[...dbMov,...tnorm.filter(t=>!dbMov.find(d=>d.tmdb_id===t.tmdb_id))];
  const hero=movData.find(m=>m.backdrop_url)||tnorm[0];
  if(hero) setHero('mov',hero);
  buildT10('movT10',ttop.slice(0,10));
  buildPills('movGP',MOVGENRES,g=>{ movF.genre=g==='All'?'':g; movPage=0; renderMov(); });
  renderMov();
}
function renderMov(){
  let d=[...movData];
  if(movF.lang) d=d.filter(m=>(m.language||m.lang)===movF.lang);
  if(movF.genre) d=d.filter(m=>(m.genres||m.genre||[]).includes(movF.genre));
  if(movF.sort==='rating') d.sort((a,b)=>(b.rating||b.vote_average||0)-(a.rating||a.vote_average||0));
  if(movF.sort==='alpha') d.sort((a,b)=>a.title.localeCompare(b.title));
  if(movF.sort==='year') d.sort((a,b)=>(b.year||'')>(a.year||'')?1:-1);
  const pg=d.slice(0,PS*(movPage+1));
  document.getElementById('movCnt').textContent=d.length+' titles';
  document.getElementById('movGrid').className='cgrid'+(movV==='list'?' lm':'');
  document.getElementById('movGrid').innerHTML=pg.map(m=>cHTML(m,movV==='list')).join('');
  document.getElementById('movLM').style.display=d.length>pg.length?'block':'none';
}
function sortMov(s){ movF.sort=s; movPage=0; renderMov(); }
function filterMovL(l){ movF.lang=l; movPage=0; renderMov(); }
function loadMore(t){ if(t==='tv'){tvPage++;renderTV();}else{movPage++;renderMov();} }
function setV(t,v,btn){ if(t==='tv'){tvV=v;document.querySelectorAll('#pg-tv .vb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderTV();}else{movV=v;document.querySelectorAll('#pg-movies .vb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderMov();} }

// ── NEW & POPULAR ─────────────────────────
async function loadNP(tab){
  const c=document.getElementById('npCont'); c.innerHTML=skelG(12);
  const [tr,up]=await Promise.all([TMDB.trending(),TMDB.upcoming()]);
  npItems=[...(tr?.results||[]),...(up?.results||[])].filter(m=>m.poster_path).map(TMDB.normalize);
  renderNP(tab);
}
function npSwitch(t,btn){ document.querySelectorAll('#pg-new .ptab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderNP(t); }
function renderNP(tab){
  const c=document.getElementById('npCont');
  if(!npItems.length){c.innerHTML=skelG(12);return;}
  if(tab==='top10'){
    c.innerHTML=`<div class="t10w">${npItems.slice(0,10).map((m,i)=>{const ms=JSON.stringify(m).replace(/"/g,'&quot;');return`<div class="t10c" onclick="openMod(${ms})"><div class="t10n">${i+1}</div><img class="t10p" src="${m.poster_url||''}" alt="${m.title}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.title)}&background=222&color=555'"></div>`}).join('')}</div>`;
    return;
  }
  const items=tab==='new'?[...npItems].reverse():npItems;
  c.innerHTML=`<div class="npl">${items.slice(0,25).map((m,i)=>{const ms=JSON.stringify(m).replace(/"/g,'&quot;');return`<div class="npc" onclick="openMod(${ms})"><div class="nprk">${i+1}</div><img class="npth" src="${m.poster_url||''}" alt="${m.title}" onerror="this.style.display='none'"><div class="npif"><div class="nptl">${m.title}</div><div class="npmt"><span>${m.year||''}</span><span style="color:var(--green)">★ ${m.rating||''}</span>${i<4?'<span class="npnew">NEW</span>':i<10?'<span class="nphot">🔥</span>':''}</div></div><div class="npact"><button class="npb" onclick="event.stopPropagation();play(${ms})">▶</button><button class="npb" onclick="event.stopPropagation();addML(${ms})">+</button></div></div>`}).join('')}</div>`;
}

// ── LANGUAGES ─────────────────────────────
function buildLangs(){
  document.getElementById('langG').innerHTML=LANGS.map(l=>`<div onclick="switchPage('movies');filterMovL('${l.code}')" style="background:linear-gradient(135deg,${l.bg} 0%,rgba(255,255,255,.04) 100%);border:1px solid var(--border);border-radius:9px;padding:20px 16px;cursor:pointer;transition:border-color .2s;display:flex;align-items:center;justify-content:space-between" onmouseover="this.style.borderColor='rgba(255,255,255,.26)'" onmouseout="this.style.borderColor='var(--border)'"><div><div style="font-size:1.6rem;margin-bottom:6px">${l.icon}</div><div style="font-size:.95rem;font-weight:700;color:#fff;margin-bottom:2px">${l.name}</div><div style="font-size:.7rem;color:rgba(255,255,255,.38)">${l.count.toLocaleString()} titles</div></div><div style="font-size:.8rem;color:rgba(255,255,255,.25)">›</div></div>`).join('');
}

// ── HERO ──────────────────────────────────
function setHero(type,m){
  const bg=document.getElementById(type+'Bg'), hc=document.getElementById(type+'HeroC');
  if(bg) bg.style.backgroundImage=`url('${m.backdrop_url||m.poster_url}')`;
  if(!hc) return;
  const match=Math.round(65+parseFloat(m.rating||m.vote_average||7)*3.5);
  const ms=JSON.stringify(m).replace(/"/g,'&quot;');
  hc.innerHTML=`<div class="h-badge">★ TOP PICK</div><div class="h-title">${m.title}</div><div class="h-meta"><span class="h-match">${match}% Match</span><span>${m.year||''}</span><span class="h-cert">${m.age_rating||'UA'}</span>${m.quality?`<span style="background:rgba(70,211,105,.12);color:var(--green);font-size:.64rem;font-weight:700;padding:2px 6px;border-radius:3px">${m.quality}</span>`:''}</div><div class="h-ov">${m.overview||''}</div><div class="h-btns"><button class="btn-p" onclick="play(${ms})">▶ Play</button><button class="btn-i" onclick="openMod(${ms})">ⓘ Info</button></div>`;
}

// ── HELPERS ───────────────────────────────
function buildT10(elId,items){
  document.getElementById(elId).innerHTML=items.map((m,i)=>{const ms=JSON.stringify(m).replace(/"/g,'&quot;');return`<div class="t10c" onclick="openMod(${ms})"><div class="t10n">${i+1}</div><img class="t10p" src="${m.poster_url||''}" alt="${m.title}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.title)}&background=222&color=555'"></div>`}).join('');
}
function buildPills(id,list,cb){
  const c=document.getElementById(id); c.innerHTML='';
  list.forEach((g,i)=>{ const b=document.createElement('button'); b.className='gp'+(i===0?' on':''); b.textContent=g; b.onclick=()=>{ c.querySelectorAll('.gp').forEach(x=>x.classList.remove('on')); b.classList.add('on'); cb(g); }; c.appendChild(b); });
}
function cHTML(m,isList){
  const ms=JSON.stringify(m).replace(/"/g,'&quot;'), rat=m.rating||m.vote_average||'';
  if(isList) return `<div class="card lc" onclick="openMod(${ms})"><div class="cth"><img class="ci" src="${m.poster_url||''}" alt="${m.title}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.title)}&background=222&color=555'"><div class="cov"><button class="cpl" onclick="event.stopPropagation();play(${ms})">▶</button></div></div><div class="cif"><div class="cn">${m.title}</div><div class="cm"><span>${m.year||''}</span>${rat?`<span>·</span><span style="color:var(--green)">★ ${rat}</span>`:''}</div></div><div class="lacts"><button class="lb" onclick="event.stopPropagation();play(${ms})">▶</button><button class="lb" onclick="event.stopPropagation();addML(${ms})">+</button></div></div>`;
  return `<div class="card" onclick="openMod(${ms})"><div class="cth"><img class="ci" src="${m.poster_url||''}" alt="${m.title}" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.title)}&background=222&color=555&size=400'"><span class="ctyp ${m.type||'movie'}">${m.type==='tv'?'TV':'MOVIE'}</span>${rat?`<span class="crat">★ ${rat}</span>`:''}<div class="cov"><button class="cpl" onclick="event.stopPropagation();play(${ms})">▶</button><button class="cad" onclick="event.stopPropagation();addML(${ms})">+</button></div></div><div class="cif"><div class="cn">${m.title}</div><div class="cm"><span>${m.year||''}</span></div></div></div>`;
}
function play(m){ const p=new URLSearchParams({id:m.id||'',title:m.title,type:m.type||'movie',year:m.year||'',quality:m.quality||'',embed:m.embed_url||'',poster:m.poster_url||'',backdrop:m.backdrop_url||''}); window.location.href='XverseMovies_Player.html?'+p.toString(); }
async function addML(m){ if(!currentUser||!m.id){showToast('⚠️ Admin Panel mein add karo'); return;} await DB.addToMyList(currentUser.id,m.id); showToast('✅ Added to My List'); }
function openMod(m){
  const ms=JSON.stringify(m).replace(/"/g,'&quot;');
  const match=Math.round(65+parseFloat(m.rating||m.vote_average||7)*3.5);
  document.getElementById('modImg').src=m.backdrop_url||m.poster_url||'';
  document.getElementById('modTit').textContent=m.title;
  document.getElementById('modMeta').innerHTML=`<span class="mmt">${match}% Match</span><span>${m.year||''}</span><span class="mce">${m.age_rating||'UA'}</span>${m.quality?`<span style="background:rgba(70,211,105,.1);color:var(--green);font-size:.61rem;font-weight:700;padding:1px 6px;border-radius:3px">${m.quality}</span>`:''}`;
  document.getElementById('modOv').textContent=m.overview||'';
  document.getElementById('mPlayBtn').onclick=()=>{closeMod();play(m);};
  document.getElementById('mAddBtn').onclick=()=>{addML(m);closeMod();};
  document.getElementById('modBg').classList.add('open');
}
function closeMod(){ document.getElementById('modBg').classList.remove('open'); }
function skelG(n){ return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px">${Array(n).fill(`<div class="sk" style="aspect-ratio:2/3;border-radius:5px"></div>`).join('')}</div>`; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMod(); });
</script>
