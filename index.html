// ── HELPERS ───────────────────────────────────────
function jumpStep(n) {
  ['su1','su2','su3'].forEach((id,i)=>document.getElementById(id).style.display=i+1===n?'block':'none');
  ['sd1','sd2','sd3'].forEach((id,i)=>{const el=document.getElementById(id);el.className='sdot'+(i+1<n?' done':i+1===n?' active':'');});
}
function showMsg(id,msg,ok=false) { const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.className='msg show '+(ok?'ok':'err'); }
function errText(m) {
  const map = {
    'Invalid login credentials':              '❌ Email ya password galat hai',
    'Email not confirmed':                    '⚠️ Pehle email confirm karo',
    'User already registered':                '⚠️ Email already registered — Sign in karo',
    'Password should be at least 6 characters': '⚠️ Password min 6 characters',
    'Email rate limit exceeded':              '⏳ Bahut zyada attempts — Thodi der baad try karo',
    'signup_disabled':                        '⚠️ Registration abhi disabled hai',
    'over_request_rate_limit':                '⏳ Too many requests — Wait karo',
    'Network request failed':                 '🌐 Internet connection check karo',
  };
  for (const [k, v] of Object.entries(map)) {
    if (m.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return '❌ ' + m;
}
