<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Requests — XverseMovies</title>
<meta name="robots" content="noindex, nofollow">
<script>/* SW update → auto-reload */if('serviceWorker'in navigator){var _xvR=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(!_xvR){_xvR=true;location.reload();}});}</script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E50914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XverseMovies">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="xverse-config.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red: #E50914; --red-dark: #B00710; --green: #46d369;
  --bg: #141414; --bg2: #0a0a0a; --card: #1c1c1c; --card2: #242424;
  --text: #e5e5e5; --muted: #808080; --border: rgba(255,255,255,.08);
  --content-max: 1900px;
  --content-pad: max(4%, calc((100% - var(--content-max)) / 2));
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;overflow-x:hidden}
a{color:inherit}

nav{position:fixed;top:0;left:0;right:0;z-index:200;height:66px;display:flex;align-items:center;padding:0 var(--content-pad);gap:0;background:rgba(8,8,8,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',cursive;font-size:1.7rem;color:var(--red);letter-spacing:2px;margin-right:28px;cursor:pointer;text-decoration:none;flex-shrink:0}
.logo span{color:#fff}
.nav-links{display:flex;gap:2px;list-style:none}
.nl{background:none;border:none;color:rgba(255,255,255,.75);font-size:.86rem;font-weight:500;padding:8px 14px;cursor:pointer;font-family:'Barlow',sans-serif;transition:color .2s}
.nl:hover{color:#fff}
@media(max-width:640px){.nav-links{display:none}}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:1rem;padding:8px;border-radius:4px;transition:background .2s}
.nav-btn:hover{background:rgba(255,255,255,.08)}
.nav-avatar{width:32px;height:32px;border-radius:4px;background:linear-gradient(135deg,var(--red),#831010);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;cursor:pointer;color:#fff;overflow:hidden;flex-shrink:0}
.req-cta{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;background:rgba(229,9,20,.16);border:1px solid rgba(229,9,20,.45);color:#fff;text-decoration:none;font-size:.8rem;font-weight:700;transition:.2s;white-space:nowrap}
.req-cta:hover{background:rgba(229,9,20,.3)}

#pageWrap{padding-top:66px;max-width:980px;margin:0 auto;padding-left:var(--content-pad);padding-right:var(--content-pad);padding-bottom:60px}
.page-hd{padding:36px 0 20px}
.page-tit{font-family:'Bebas Neue',cursive;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:1.5px;color:#fff}
.page-sub{font-size:.9rem;color:var(--muted);margin-top:6px}

.status-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border);scrollbar-width:none}
.status-tabs::-webkit-scrollbar{display:none}
.st-tab{flex-shrink:0;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:20px;padding:7px 16px;font-size:.8rem;font-weight:600;color:rgba(255,255,255,.65);cursor:pointer;white-space:nowrap;transition:.15s}
.st-tab.active{background:#fff;color:#000;border-color:#fff}

.req-card{display:flex;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.req-poster{width:70px;height:105px;object-fit:cover;border-radius:6px;background:#2a2a2a;flex-shrink:0}
.req-info{flex:1;min-width:0}
.req-title{font-size:1rem;font-weight:700;color:#fff}
.req-meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.req-meta-chip{font-size:.7rem;color:rgba(255,255,255,.55);background:rgba(255,255,255,.05);padding:3px 9px;border-radius:12px}
.req-date{font-size:.72rem;color:var(--muted);margin-top:8px}
.req-status{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:4px 11px;border-radius:14px;margin-top:10px}
.req-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.req-btn{background:var(--red);color:#fff;border:none;padding:8px 16px;border-radius:5px;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.req-btn.sec{background:rgba(255,255,255,.1)}

.empty-state{text-align:center;padding:70px 20px;color:var(--muted)}
.empty-ico{font-size:3rem;margin-bottom:14px;opacity:.5}
.empty-title{font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:6px}
.empty-btn{margin-top:16px;background:var(--red);color:#fff;border:none;padding:11px 26px;border-radius:6px;font-size:.86rem;font-weight:700;cursor:pointer;font-family:'Barlow',sans-serif}

.skel{background:linear-gradient(90deg,#222 25%,#2a2a2a 50%,#222 75%);background-size:200% 100%;animation:skelA 1.4s infinite;border-radius:6px}
@keyframes skelA{0%{background-position:200%}100%{background-position:-200%}}

/* MOBILE BOTTOM NAV */
.mob-nav{display:none}
@media(max-width:640px){
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(9,9,9,.97);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box}
  .mnav-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 2px 8px;text-decoration:none;color:rgba(255,255,255,.42);font-family:'Barlow',sans-serif;transition:color .18s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;box-sizing:border-box}
  .mnav-item.active{color:#fff}
  .mnav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--red);border-radius:0 0 3px 3px}
  .mnav-ico{width:22px;height:22px;fill:currentColor;flex-shrink:0}
  .mnav-lbl{font-size:.56rem;font-weight:600;letter-spacing:.1px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
  .mnav-avatar{width:22px;height:22px;border-radius:4px;background:linear-gradient(135deg,var(--red),#831010);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.6rem;color:#fff;overflow:hidden;flex-shrink:0}
  #pageWrap{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .req-card{flex-direction:row}
  .req-poster{width:56px;height:84px}
}
</style>
</head>
<body>

<nav>
  <a class="logo" href="XverseMovies_Home.html">Xverse<span>Movies</span></a>
  <ul class="nav-links">
    <li><button class="nl" onclick="location.href='XverseMovies_Home.html'">Home</button></li>
    <li><button class="nl" onclick="location.href='XverseMovies_Browse.html'">Browse</button></li>
    <li><button class="nl" style="color:#fff;font-weight:700" disabled>My Requests</button></li>
  </ul>
  <div class="nav-r">
    <a href="XverseMovies_Request.html" class="req-cta">🎬 Request</a>
    <button class="nav-btn" title="Search" onclick="location.href='XverseMovies_Search.html'">🔍</button>
    <div class="nav-avatar" id="navAvatar">U</div>
  </div>
</nav>

<div id="pageWrap">
  <div class="page-hd">
    <div class="page-tit">My Requests</div>
    <div class="page-sub">Track the status of every title you've requested.</div>
  </div>

  <div class="status-tabs" id="statusTabs">
    <div class="st-tab active" data-f="all" onclick="setFilter('all',this)">All</div>
    <div class="st-tab" data-f="pending" onclick="setFilter('pending',this)">Pending</div>
    <div class="st-tab" data-f="accepted" onclick="setFilter('accepted',this)">Accepted</div>
    <div class="st-tab" data-f="processing" onclick="setFilter('processing',this)">Processing</div>
    <div class="st-tab" data-f="uploading" onclick="setFilter('uploading',this)">Uploading</div>
    <div class="st-tab" data-f="completed" onclick="setFilter('completed',this)">Completed</div>
    <div class="st-tab" data-f="rejected" onclick="setFilter('rejected',this)">Rejected</div>
  </div>

  <div id="listWrap">
    <div class="req-card"><div class="skel req-poster"></div><div class="req-info" style="display:flex;flex-direction:column;gap:8px;justify-content:center"><div class="skel" style="width:60%;height:18px"></div><div class="skel" style="width:40%;height:14px"></div></div></div>
    <div class="req-card"><div class="skel req-poster"></div><div class="req-info" style="display:flex;flex-direction:column;gap:8px;justify-content:center"><div class="skel" style="width:50%;height:18px"></div><div class="skel" style="width:35%;height:14px"></div></div></div>
  </div>
</div>

<!-- MOBILE BOTTOM NAV -->
<nav class="mob-nav" aria-label="Mobile navigation">
  <a class="mnav-item" href="XverseMovies_Home.html">
    <svg class="mnav-ico" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span class="mnav-lbl">Home</span>
  </a>
  <a class="mnav-item" href="XverseMovies_Browse.html#new">
    <svg class="mnav-ico" viewBox="0 0 24 24"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/></svg>
    <span class="mnav-lbl">New &amp; Hot</span>
  </a>
  <a class="mnav-item" href="XverseMovies_Search.html">
    <svg class="mnav-ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <span class="mnav-lbl">Search</span>
  </a>
  <a class="mnav-item" href="XverseMovies_MyList.html">
    <svg class="mnav-ico" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    <span class="mnav-lbl">My List</span>
  </a>
  <a class="mnav-item" href="javascript:void(0)" id="mnavProfileTab" aria-label="Profile" onclick="document.getElementById('mnavProfileAvatar').click()">
    <div class="mnav-avatar" id="mnavProfileAvatar">U</div>
    <span class="mnav-lbl">Profile</span>
  </a>
</nav>

<script>
let currentUser  = null;
let allRequests  = [];
let activeFilter = 'all';

(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;
  await initNavAvatar('navAvatar');
  await initNavAvatar('mnavProfileAvatar');

  allRequests = await DB.getUserRequests(currentUser.id);
  render();
})();

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.st-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const wrap = document.getElementById('listWrap');
  const items = activeFilter === 'all' ? allRequests : allRequests.filter(r => r.status === activeFilter);

  if (!allRequests.length) {
    wrap.innerHTML = `
      <div class="empty-state">
        <div class="empty-ico">🎬</div>
        <div class="empty-title">No requests yet</div>
        <div>Can't find a movie or show? Request it — starting at just ₹9.</div>
        <button class="empty-btn" onclick="location.href='XverseMovies_Request.html'">Request a Title</button>
      </div>`;
    return;
  }

  if (!items.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-ico">🔍</div><div class="empty-title">No requests in this status</div></div>`;
    return;
  }

  wrap.innerHTML = items.map(r => cardHTML(r)).join('');
}

function cardHTML(r) {
  const st = XVERSE.REQUEST_STATUS[r.status] || { label: r.status, color: '#888' };
  const typeLabel = r.request_type === 'season'
    ? `Season ${r.season_number || ''}`.trim()
    : (XVERSE.REQUEST_PRICES[r.request_type]?.label || r.request_type);
  const date = new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

  const actions = [];
  if (r.status === 'completed' && r.watch_url) {
    actions.push(`<a class="req-btn" href="${escAttr(r.watch_url)}">▶ Watch</a>`);
  }
  if (r.status === 'completed' && r.download_url) {
    actions.push(`<a class="req-btn sec" href="${escAttr(r.download_url)}" download>⬇ Download</a>`);
  }

  return `
    <div class="req-card">
      <img class="req-poster" src="${escAttr(r.poster_url || '')}" alt="" onerror="this.style.visibility='hidden'">
      <div class="req-info">
        <div class="req-title">${escHtml(r.title)}</div>
        <div class="req-meta-row">
          <span class="req-meta-chip">${escHtml(typeLabel)}</span>
          <span class="req-meta-chip">${escHtml(r.preferred_language || '—')}</span>
          <span class="req-meta-chip">${escHtml(r.preferred_quality === 'highest' ? '⭐ Highest' : (r.preferred_quality || '—'))}</span>
        </div>
        <div class="req-date">Requested on ${date}</div>
        <div class="req-status" style="background:${st.color}22;color:${st.color};border:1px solid ${st.color}55">● ${escHtml(st.label)}</div>
        ${actions.length ? `<div class="req-actions">${actions.join('')}</div>` : ''}
      </div>
    </div>`;
}

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s) { return escHtml(s); }
</script>
</body>
</html>
