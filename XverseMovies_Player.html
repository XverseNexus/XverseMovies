<style>
*,*::before,*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent; /* remove tap flash on mobile */
}

html,body{
  width:100%;
  height:100%;
  /* height:100dvh for mobile browsers with dynamic toolbar */
  height:100dvh;
  background:#000;
  overflow:hidden;
  font-family:'Barlow',sans-serif;
  color:#fff;
  /* Prevent iOS bounce scroll */
  position:fixed;
  overscroll-behavior:none;
}

/* ── PLAYER WRAPPER ─────────────────────────────────────── */
#playerWrap{
  position:relative;
  width:100vw;
  height:100vh;
  height:100dvh;
  background:#000;
  /* IMPORTANT: overflow:hidden clips the scaled-up iframe to viewport bounds */
  overflow:hidden;
  /* GPU compositing layer — improves transform performance on mobile */
  will-change:transform;
}

/* ── IFRAME ─────────────────────────────────────────────── */
/* FIX #2 (primary): JS will override width/height/transform on mobile.
   These are the desktop defaults. */
#stFrame{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
  z-index:1;
  display:none;
  background:#000;
  /* Smooth scale transitions on orientation change */
  transition:none;
}

/* ── LOADING ────────────────────────────────────────────── */
#loadScreen{
  position:absolute;
  inset:0;
  z-index:20;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
}

.ld-logo{
  font-family:'Bebas Neue',cursive;
  font-size:2.8rem;
  color:#E50914;
  letter-spacing:2px;
}

.ld-logo span{ color:#fff; }

.ld-bar{
  width:220px;
  height:3px;
  background:#222;
  overflow:hidden;
  border-radius:3px;
}

.ld-fill{
  width:0;
  height:100%;
  background:#E50914;
  animation:loadAnim 2s ease forwards;
}

@keyframes loadAnim{ from{width:0} to{width:100%} }

.ld-msg{ color:#666; font-size:.8rem; text-align:center; padding:0 20px; }

/* ── TAP ZONE (FIX #3 + #5) ───────────────────────────── */
/* Transparent layer between iframe and overlay bars.
   Intercepts taps to toggle the overlay UI.
   z-index 5: above iframe(1) but below bars(10). */
#tapZone{
  position:absolute;
  inset:0;
  z-index:5;
  background:transparent;
  cursor:pointer;
  /* Only active when UI is hidden — pointer-events toggled by JS */
  pointer-events:none;
}

/* When UI is hidden, tapZone catches taps to bring UI back */
#playerWrap:not(.ui-on) #tapZone{
  pointer-events:auto;
}

/* ── TOP BAR ────────────────────────────────────────────── */
#topBar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  /* env() provides notch/Dynamic Island safe area on iOS */
  padding: max(18px, calc(14px + env(safe-area-inset-top))) 
           max(20px, env(safe-area-inset-right))
           14px
           max(20px, env(safe-area-inset-left));
  display:flex;
  align-items:center;
  gap:14px;
  background:linear-gradient(to bottom, rgba(0,0,0,.88) 0%, transparent 100%);
  transform:translateY(-100%);
  transition:transform .3s ease;
  pointer-events:none;
}

#playerWrap.ui-on #topBar{
  transform:translateY(0);
  pointer-events:auto;
}

/* ── BOTTOM BAR ─────────────────────────────────────────── */
#bottomBar{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:10;
  /* env() provides home-bar safe area on iPhone */
  padding: 14px
           max(20px, env(safe-area-inset-right))
           max(22px, calc(16px + env(safe-area-inset-bottom)))
           max(20px, env(safe-area-inset-left));
  background:linear-gradient(to top, rgba(0,0,0,.92) 0%, transparent 100%);
  transform:translateY(100%);
  transition:transform .3s ease;
  pointer-events:none;
}

#playerWrap.ui-on #bottomBar{
  transform:translateY(0);
  pointer-events:auto;
}

/* ── BUTTONS ────────────────────────────────────────────── */
.back-btn,.top-btn,.ctrl-btn{
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  cursor:pointer;
  transition:.2s;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  /* FIX: minimum 44px touch target on mobile (Apple HIG / Material guidelines) */
  min-width:44px;
  min-height:44px;
}

.back-btn:hover,.top-btn:hover,.ctrl-btn:hover{
  background:rgba(255,255,255,.15);
}

.back-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:1.1rem;
}

.top-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:.95rem;
}

.ctrl-btn{
  width:44px;
  height:44px;
  border-radius:8px;
  font-size:1rem;
}

/* Desktop: tighter buttons */
@media(min-width:768px){
  .back-btn{ width:38px; height:38px; min-width:unset; min-height:unset; font-size:1rem; }
  .top-btn { width:34px; height:34px; min-width:unset; min-height:unset; }
  .ctrl-btn{ width:36px; height:36px; min-width:unset; min-height:unset; }
}

.top-info{
  flex:1;
  min-width:0;
}

.top-title{
  font-size:1rem;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-sub{
  font-size:.72rem;
  color:rgba(255,255,255,.55);
}

.movie-meta{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.meta-badge{
  background:rgba(70,211,105,.12);
  border:1px solid rgba(70,211,105,.2);
  color:#46d369;
  font-size:.65rem;
  font-weight:700;
  padding:3px 8px;
  border-radius:4px;
}

.meta-text{
  color:rgba(255,255,255,.55);
  font-size:.74rem;
}

.ctrl-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.ctrl-spacer{ flex:1; }

.ctrl-hint{
  font-size:.7rem;
  color:#666;
}

@media(max-width:480px){
  /* On small phones, hide the hint text to save space */
  .ctrl-hint{ display:none; }
}

.ml-btn{
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;
  padding:9px 16px;
  border-radius:4px;
  cursor:pointer;
  font-size:.75rem;
  font-family:'Barlow',sans-serif;
  transition:.2s;
  min-height:44px;
  display:flex;
  align-items:center;
}

.ml-btn.added{
  border-color:#46d369;
  color:#46d369;
}

/* Desktop mode indicator badge */
#desktopBadge{
  background:rgba(70,130,255,.15);
  border:1px solid rgba(70,130,255,.3);
  color:rgba(70,130,255,.9);
  font-size:.58rem;
  font-weight:700;
  padding:2px 7px;
  border-radius:4px;
  display:none;
  white-space:nowrap;
  letter-spacing:.3px;
}

#desktopBadge.show{ display:inline-flex; }

/* ── PLAN GATE ──────────────────────────────────────────── */
#planGate{
  position:absolute;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.94);
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px max(20px, env(safe-area-inset-left));
  text-align:center;
}

#planGate.show{ display:flex; }

.gate-title{
  font-family:'Bebas Neue',cursive;
  font-size:2rem;
  margin-top:8px;
  letter-spacing:2px;
}

.gate-sub{
  color:rgba(255,255,255,.6);
  margin-top:8px;
  max-width:420px;
  line-height:1.6;
}

.gate-plans{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:20px;
}

.gate-plan{
  border:1px solid rgba(255,255,255,.2);
  border-radius:8px;
  padding:14px 18px;

.gate-plan:hover{ border-color:#fff; background:rgba(255,255,255,.05); }
.gate-plan.popular{ border-color:#E50914; }

.gp-name{ font-size:.9rem; font-weight:700; }
.gp-price{ font-family:'Bebas Neue',cursive; color:#E50914; font-size:1.4rem; margin-top:4px; }
.gp-desc{ color:rgba(255,255,255,.45); font-size:.7rem; }

.btn-back-gate{
  margin-top:18px;
  padding:11px 24px;
  border-radius:4px;
  border:1px solid rgba(255,255,255,.2);
  background:transparent;
  color:#aaa;
  cursor:pointer;
  font-family:'Barlow',sans-serif;
  font-size:.85rem;
  min-height:44px;
}

/* ── SYNC DOT ───────────────────────────────────────────── */
#syncDot{
  position:absolute;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  background:rgba(70,211,105,.15);
  border:1px solid rgba(70,211,105,.25);
  color:#46d369;
  padding:4px 10px;
  border-radius:20px;
  font-size:.65rem;
  opacity:0;
  transition:.3s;
  white-space:nowrap;
  pointer-events:none;
}

#syncDot.show{ opacity:1; }

/* ── MOBILE DESKTOP-MODE NOTICE ─────────────────────────── */
#mobileNotice{
  position:absolute;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  z-index:11;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.7);
  padding:6px 14px;
  border-radius:20px;
  font-size:.68rem;
  white-space:nowrap;
  opacity:0;
  transition:opacity .4s;
  pointer-events:none;
}

#mobileNotice.show{
  opacity:1;
}
</style>

<body>
<div id="playerWrap">

  <!-- LOADING -->
  <div id="loadScreen">
    <div class="ld-logo">Xverse<span>Movies</span></div>
    <div class="ld-bar"><div class="ld-fill"></div></div>
    <div class="ld-msg" id="ldMsg">Loading video...</div>
  </div>

  <!-- PLAN GATE -->
  <div id="planGate">
    <div style="font-size:3rem;">🔒</div>
    <div class="gate-title">Upgrade Your Plan</div>
    <div class="gate-sub" id="gateSub">This content requires a higher plan.</div>
    <div class="gate-plans">
      <div class="gate-plan" onclick="upgradePlan('hd')">
        <div class="gp-name">HD</div>
        <div class="gp-price">₹29</div>

      </div>
      <div class="gate-plan popular" onclick="upgradePlan('fhd')">
        <div class="gp-name">Full HD ⭐</div>
        <div class="gp-price">₹49</div>
        <div class="gp-desc">1080p · 2 screens</div>
      </div>
      <div class="gate-plan" onclick="upgradePlan('uhd')">
        <div class="gp-name">4K Ultra HD</div>
        <div class="gp-price">₹99</div>
        <div class="gp-desc">4K · 4 screens</div>
      </div>
    </div>
    <button class="btn-back-gate" onclick="goBack()">← Go Back</button>
  </div>

  <!-- ═══════════════════════════════════════════════════════
       IFRAME
       FIX #1: webkit-allowfullscreen + mozallowfullscreen for iOS/Firefox
       FIX #1: expanded allow attribute covers all APIs embedded players use
       FIX #2: width/height/transform overridden by setIframeScale() on mobile
       ═══════════════════════════════════════════════════════ -->
  <iframe
    id="stFrame"
    allowfullscreen
    webkit-allowfullscreen
    mozallowfullscreen
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture; web-share;
           accelerometer; gyroscope; magnetometer; screen-wake-lock;
           display-capture; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
    scrolling="no"
    frameborder="0"
  ></iframe>

  <!-- SYNC -->
  <div id="syncDot">✓ Progress synced</div>

  <!-- Mobile desktop-mode notice (fades out after 3s) -->
  <div id="mobileNotice">🖥 Desktop player mode — full controls visible</div>

  <!-- FIX #3 + #5: tap zone intercepts taps when overlay is hidden
       so user can bring UI back without tapping an overlay button.
       pointer-events toggled by CSS (:not(.ui-on) rule above). -->
  <div id="tapZone" onclick="showUI()"></div>

  <!-- TOP BAR -->
  <div id="topBar">
    <button class="back-btn" onclick="goBack()" aria-label="Go back">←</button>
    <div class="top-info">
      <div class="top-title" id="topTitle">Loading...</div>
      <div class="top-sub" id="topSub"></div>
    </div>
    <span id="desktopBadge" title="Desktop mode active — all player controls visible">🖥 Desktop</span>
    <button class="top-btn" onclick="reqFS()" aria-label="Fullscreen">⛶</button>
  </div>

  <!-- BOTTOM BAR -->
  <div id="bottomBar">
    <div class="movie-meta">
      <span class="meta-badge" id="qualBadge">HD</span>

      <span class="meta-text" id="ageBadge"></span>

      <button class="ml-btn" id="mlBtn" onclick="toggleML()">＋ My List</button>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn" onclick="goBack()" aria-label="Home">🏠</button>
      <div class="ctrl-spacer"></div>
      <span class="ctrl-hint">Tap screen for controls</span>
      <button class="ctrl-btn" onclick="reqFS()" aria-label="Fullscreen">⛶</button>
    </div>
  </div>

</div>

<script>
'use strict';

let currentUser = null;
let movieData   = null;
let isInML      = false;
let uiTimer     = null;
let syncTimer   = null;
let watchStart  = null;

const PLAN_ORDER = { free:0, hd:1, fhd:2, uhd:3 };

/* ─────────────────────────────────────────────────────────
   FIX #2 — IFRAME SCALE TRICK (PRIMARY FIX)

   Root cause: Embedded players (VidSrc, etc.) detect the
   iframe's internal window.innerWidth to decide which UI
   to render. On a 360px mobile screen, width < 768px →
   simplified native controls, quality/subtitle/settings
   menus all hidden.

   Fix: Set iframe width to DESKTOP_W (960px), then apply
   CSS transform scale(vw / 960) so it visually fills the
   screen. Inside the iframe, window.innerWidth = 960px →
   embedded player renders full desktop UI with all controls.

   overflow:hidden on #playerWrap clips the layout box to
   the visible viewport, so nothing bleeds outside.
───────────────────────────────────────────────────────── */
const DESKTOP_W = 960; // px — player shows full controls at this width
let   _isMobile = false;

function setIframeScale() {
  const frame = document.getElementById('stFrame');
  if (!frame) return;

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  if (vw < DESKTOP_W) {
    _isMobile = true;
    const scale     = vw / DESKTOP_W;
    const scaledH   = Math.ceil(vh / scale);

    frame.style.width           = DESKTOP_W + 'px';
    frame.style.height          = scaledH   + 'px';
    frame.style.transform       = 'scale(' + scale + ')';
    frame.style.transformOrigin = '0 0';
    frame.style.position        = 'absolute';
    frame.style.top             = '0';
    frame.style.left            = '0';

    // Show the desktop-mode badge in top bar
    const badge = document.getElementById('desktopBadge');
    if (badge) badge.classList.add('show');

  } else {
    _isMobile = false;

    // Desktop: reset to 100% × 100%
    frame.style.width           = '100%';
    frame.style.height          = '100%';
    frame.style.transform       = 'none';
    frame.style.transformOrigin = '';
    frame.style.position        = 'absolute';
    frame.style.top             = '0';
    frame.style.left            = '0';

    const badge = document.getElementById('desktopBadge');
    if (badge) badge.classList.remove('show');
  }
}

// Recalculate on resize and orientation change
window.addEventListener('resize', setIframeScale);
window.addEventListener('orientationchange', function() {
  // Short delay lets the browser finish rotating before we read dimensions
  setTimeout(setIframeScale, 350);
});

/* ─────────────────────────────────────────────────────────
   INIT
───────────────────────────────────────────────────────── */
(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;

  const p          = new URLSearchParams(location.search);
  const movieId    = p.get('id');
  const urlSeason  = parseInt(p.get('season'))  || 1;
  const urlEpisode = parseInt(p.get('episode')) || 1;

  let movie = null;
  if (movieId) movie = await DB.getMovie(parseInt(movieId));

  if (!movie) {
    movie = {
      id:          movieId ? parseInt(movieId) : null,
      tmdb_id:     p.get('tmdb_id')  ? parseInt(p.get('tmdb_id')) : null,
      title:       p.get('title')    || 'Movie',
      type:        p.get('type')     || 'movie',
      year:        p.get('year')     || '',
      quality:     p.get('quality')  || '',
      age_rating:  p.get('age')      || 'UA',
      duration:    p.get('dur')      || '',
      min_plan:    p.get('minPlan')  || 'free',
      embed_url:   p.get('embed')    || '',
      poster_url:  p.get('poster')   || '',
      backdrop_url:p.get('backdrop') || '',
    };
  }

  movie._season  = urlSeason;
  movie._episode = urlEpisode;
  movieData = movie;

  const profile  = await Auth.getProfile(currentUser.id);
  const userPlan = profile?.plan || 'free';
  const reqPlan  = movie.min_plan || 'free';

  if ((PLAN_ORDER[userPlan] ?? 0) < (PLAN_ORDER[reqPlan] ?? 0)) {
    showPlanGate(reqPlan);
    return;
  }

  if (movie.id) {
    isInML = await DB.isInMyList(currentUser.id, movie.id);
    updateMLBtn();
  }

  loadVideo(movie);

  if (movie.id) {
    DB.addToHistory(currentUser.id, movie.id).catch(() => {});
    DB.incrementViews(movie.id).catch(() => {});
  }

  watchStart = Date.now();
  syncTimer  = setInterval(syncProgress, 30000);
})();

/* ─────────────────────────────────────────────────────────
   LOAD VIDEO
───────────────────────────────────────────────────────── */
function loadVideo(m) {
  const season  = m._season  || 1;
  const episode = m._episode || 1;
  const isTV    = m.type === 'tv';

  document.getElementById('topTitle').textContent = m.title;
  document.getElementById('topSub').textContent   = isTV
    ? 'Season ' + season + ' · Episode ' + episode
    : (m.year || '');

  document.getElementById('qualBadge').textContent = m.quality || 'HD';
  document.getElementById('yearBadge').textContent = m.year || '';
  document.getElementById('ageBadge').textContent  = m.age_rating || '';
  document.getElementById('durBadge').textContent  = m.duration || '';

  document.title = isTV
    ? m.title + ' S' + season + 'E' + episode + ' — XverseMovies'
    : m.title + ' — XverseMovies';

  // Embed URL priority: DB override → URL param → auto-build from TMDB
  const dbEmbed  = (m.embed_url && m.embed_url.trim()) ? m.embed_url.trim() : null;
  const urlEmbed = (m.embedUrl  && m.embedUrl.trim())  ? m.embedUrl.trim()  : null;
  let   embedUrl = dbEmbed || urlEmbed;

  if (!embedUrl) {
    const tid = m.tmdb_id || null;
    if (tid && m.auto_embed !== false) {
      embedUrl = isTV
        ? 'https://vidsrc.to/embed/tv/' + tid + '/' + season + '/' + episode
        : 'https://vidsrc.to/embed/movie/' + tid;
    }
  }

  if (m.embed_working === false && !m.manual_embed) {
    document.getElementById('ldMsg').innerHTML =
      '⚠️ This video may be unavailable.<br>' +
      '<span style="font-size:.72rem;color:#888">Admin panel mein custom embed set karo.</span>';
    document.getElementById('ldMsg').style.color = '#f5c518';
    if (!embedUrl) return;
  }

  if (!embedUrl) {
    document.getElementById('ldMsg').innerHTML =
      '⚠️ Video URL not found.<br>' +
      '<span style="font-size:.72rem;color:#888">Admin panel se embed URL set karo.</span>';
    document.getElementById('ldMsg').style.color = '#ff6b6b';
    return;
  }

  const frame = document.getElementById('stFrame');
  frame.src   = embedUrl;
  frame.style.display = 'block';

  // FIX #2: Apply scale immediately after iframe is made visible
  setIframeScale();

  // Show brief mobile desktop-mode notice
  if (window.innerWidth < DESKTOP_W) {
    const notice = document.getElementById('mobileNotice');
    if (notice) {
      notice.classList.add('show');
      setTimeout(() => notice.classList.remove('show'), 3000);
    }
  }

  setTimeout(() => {
    document.getElementById('loadScreen').style.display = 'none';
    showUI();
  }, 2500);
}

/* ─────────────────────────────────────────────────────────
   UI SHOW / HIDE
   FIX #3: touchstart replaces mousemove (which never fires
   on touch devices). passive:true lets the touch event reach
   the iframe so the embedded player still handles it.
───────────────────────────────────────────────────────── */
function showUI() {
  document.getElementById('playerWrap').classList.add('ui-on');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(hideUI, 4000);
}

function hideUI() {
  document.getElementById('playerWrap').classList.remove('ui-on');
}

// Desktop: mouse movement
document.addEventListener('mousemove', showUI);

// Mobile + Desktop: click / tap
document.addEventListener('click', showUI);

// FIX #3: touchstart fires reliably on ALL mobile browsers
// passive:true = doesn't block scrolling / touch in iframe
document.addEventListener('touchstart', showUI, { passive: true });

// Keep UI alive while user is actively touching the overlay buttons
document.addEventListener('touchmove', function() {
  if (document.getElementById('playerWrap').classList.contains('ui-on')) {
    clearTimeout(uiTimer);
    uiTimer = setTimeout(hideUI, 4000);
  }
}, { passive: true });

/* ─────────────────────────────────────────────────────────
   FULLSCREEN  (FIX #4)

   Cross-browser fullscreen chain:
   1. Standard Fullscreen API (Chrome, Firefox, Edge, Android)
   2. webkit prefix (older Safari, older Chrome on iOS WKWebView)
   3. Fallback: try the iframe element itself (iOS Safari)
      → frame.webkitEnterFullscreen() is the only method that
        triggers true native fullscreen on iOS Safari
───────────────────────────────────────────────────────── */
function reqFS() {
  const wrap  = document.getElementById('playerWrap');
  const frame = document.getElementById('stFrame');

  // Already in fullscreen → exit
  const inFS = document.fullscreenElement
             || document.webkitFullscreenElement
             || document.mozFullScreenElement;

  if (inFS) {
    const exit = document.exitFullscreen
               || document.webkitExitFullscreen
               || document.mozCancelFullScreen;
    if (exit) exit.call(document);
    return;
  }

  // Try wrapper div first (best experience — keeps our overlay)
  const requestFS = wrap.requestFullscreen
                  || wrap.webkitRequestFullscreen
                  || wrap.mozRequestFullScreen;

  if (requestFS) {
    requestFS.call(wrap).catch(() => {
      // Wrapper FS failed (common on iOS) → try iframe directly
      tryIframeFS(frame);
    });
  } else {
    tryIframeFS(frame);
  }
}

function tryIframeFS(frame) {
  // webkitEnterFullscreen works on iOS Safari for <video> inside iframe
  // For the iframe element itself on iOS:
  const iFS = frame.requestFullscreen
            || frame.webkitRequestFullscreen
            || frame.webkitEnterFullscreen  // iOS Safari-specific
            || frame.mozRequestFullScreen;

  if (iFS) iFS.call(frame).catch(() => {});
}

/* ─────────────────────────────────────────────────────────
   MY LIST
───────────────────────────────────────────────────────── */
async function toggleML() {
  if (!currentUser || !movieData?.id) return;
  if (isInML) {
    await DB.removeFromMyList(currentUser.id, movieData.id);
    isInML = false;
  } else {
    await DB.addToMyList(currentUser.id, movieData.id);
    isInML = true;
  }
  updateMLBtn();
}

function updateMLBtn() {
  const btn = document.getElementById('mlBtn');
  if (isInML) {
    btn.textContent = '✓ In My List';
    btn.classList.add('added');
  } else {
    btn.textContent = '＋ My List';
    btn.classList.remove('added');
  }
}

/* ─────────────────────────────────────────────────────────
   PLAN GATE
───────────────────────────────────────────────────────── */
function showPlanGate(reqPlan) {
  document.getElementById('loadScreen').style.display = 'none';
  document.getElementById('planGate').classList.add('show');
}

function upgradePlan(plan) {
  const link = XVERSE.PAYMENT[plan];
  if (link) window.open(link, '_blank');
}

/* ─────────────────────────────────────────────────────────
   SHARE
───────────────────────────────────────────────────────── */
function shareMovie() {
  if (navigator.share) {
    navigator.share({ title: movieData?.title, url: location.href });
  }
}

/* ─────────────────────────────────────────────────────────
   BACK
───────────────────────────────────────────────────────── */
async function goBack() {
  clearInterval(syncTimer);
  await syncProgress();
  if (document.referrer && document.referrer.includes('XverseMovies')) {
    history.back();
  } else {
    location.href = 'XverseMovies_Home.html';
  }
}

/* ─────────────────────────────────────────────────────────
   PROGRESS SYNC
───────────────────────────────────────────────────────── */
async function syncProgress() {
  if (!currentUser || !movieData?.id || !watchStart) return;

  const watched = Math.floor((Date.now() - watchStart) / 1000);
  const dur     = movieData.duration
                  ? parseInt(movieData.duration) * 60
                  : 5400;

  const extraData = movieData.type === 'tv'
    ? { season: movieData._season || 1, episode: movieData._episode || 1 }
    : {};

  await DB.upsertContinueWatching(
    currentUser.id, movieData.id, watched, dur, extraData
  );

  const dot = document.getElementById('syncDot');
  dot.classList.add('show');
  setTimeout(() => dot.classList.remove('show'), 2000);
}

/* ─────────────────────────────────────────────────────────
   KEYBOARD SHORTCUTS (desktop)
───────────────────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  showUI();
  if (e.key === 'Escape') goBack();
  if (e.key === 'f' || e.key === 'F') reqFS();
});

/* ─────────────────────────────────────────────────────────
   CLEANUP
───────────────────────────────────────────────────────── */
window.addEventListener('beforeunload', () => {
  clearInterval(syncTimer);
});

</script>
